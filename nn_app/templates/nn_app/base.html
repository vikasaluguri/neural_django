<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}NeuralForge{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #0a0c10;
      --surface:  #111520;
      --border:   #1e2535;
      --accent:   #00e5ff;
      --accent2:  #ff4081;
      --accent3:  #69ff47;
      --text:     #c8d6e5;
      --muted:    #556070;
      --mono:     'Share Tech Mono', monospace;
      --sans:     'Barlow', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    /* ── NAV ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 60px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,12,16,0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo {
      font-family: var(--mono);
      font-size: 1.1rem;
      color: var(--accent);
      letter-spacing: 0.12em;
      text-decoration: none;
    }
    .nav-logo span { color: var(--accent2); }
    .nav-links { display: flex; gap: 1.5rem; }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color .2s;
    }
    .nav-links a:hover { color: var(--accent); }

    /* ── LAYOUT ── */
    .container { max-width: 1140px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* ── CARDS ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      position: relative;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 8px 8px 0 0;
    }

    /* ── TYPOGRAPHY ── */
    h1 { font-size: 2.4rem; font-weight: 800; line-height: 1.1; }
    h2 { font-size: 1.5rem; font-weight: 600; }
    h3 { font-size: 1.1rem; font-weight: 600; }
    .mono { font-family: var(--mono); }
    .accent { color: var(--accent); }
    .accent2 { color: var(--accent2); }
    .accent3 { color: var(--accent3); }
    .muted { color: var(--muted); }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .65rem 1.4rem;
      border: none;
      border-radius: 5px;
      font-family: var(--sans);
      font-size: .85rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition: all .2s;
    }
    .btn-primary {
      background: var(--accent);
      color: #000;
    }
    .btn-primary:hover { background: #26f0ff; transform: translateY(-1px); box-shadow: 0 0 20px rgba(0,229,255,.3); }
    .btn-danger {
      background: transparent;
      color: var(--accent2);
      border: 1px solid var(--accent2);
    }
    .btn-danger:hover { background: var(--accent2); color: #fff; }
    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    /* ── FORM ELEMENTS ── */
    .form-group { display: flex; flex-direction: column; gap: .4rem; margin-bottom: 1.2rem; }
    .form-group label {
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .form-group input,
    .form-group select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      padding: .6rem .9rem;
      font-size: .9rem;
      font-family: var(--sans);
      transition: border-color .2s;
      width: 100%;
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(0,229,255,.1);
    }
    .form-group select option { background: var(--surface); }

    /* ── BADGE ── */
    .badge {
      display: inline-block;
      padding: .2rem .55rem;
      border-radius: 3px;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .badge-cyan   { background: rgba(0,229,255,.12); color: var(--accent); border: 1px solid rgba(0,229,255,.25); }
    .badge-pink   { background: rgba(255,64,129,.12); color: var(--accent2); border: 1px solid rgba(255,64,129,.25); }
    .badge-green  { background: rgba(105,255,71,.12); color: var(--accent3); border: 1px solid rgba(105,255,71,.25); }

    /* ── GRID ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 1.5rem; }
    @media(max-width:700px) { .grid-2,.grid-3 { grid-template-columns: 1fr; } }

    /* ── STAT BLOCK ── */
    .stat-block { text-align: center; padding: 1.2rem; }
    .stat-value { font-size: 2rem; font-weight: 800; font-family: var(--mono); }
    .stat-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-top: .3rem; }

    /* ── UTILITY ── */
    .mb1 { margin-bottom: .5rem; }
    .mb2 { margin-bottom: 1rem; }
    .mb3 { margin-bottom: 1.5rem; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap1 { gap: .5rem; }
    .gap2 { gap: 1rem; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<nav>
  <a class="nav-logo" href="{% url 'dashboard' %}">NEURAL<span>FORGE</span></a>
  <div class="nav-links">
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'create_network' %}">New Network</a>
  </div>
</nav>

{% block content %}{% endblock %}

</body>
</html>
